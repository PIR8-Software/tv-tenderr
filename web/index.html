<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Tenderr</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-dark: #0D1117;
            --bg-card: #161B22;
            --bg-sidebar: #1A2332;
            --accent: #FF6B35;
            --accent-green: #2DC653;
            --accent-yellow: #FF6B35;
            --accent-blue: #3498db;
            --accent-red: #E63946;
            --text: #FFFFFF;
            --text-dim: #8B949E;
            --text-muted: #555;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-dark); color: var(--text); display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar */
        .sidebar { width: 64px; background: var(--bg-sidebar); display: flex; flex-direction: column; align-items: center; padding: 16px 0; gap: 8px; flex-shrink: 0; }
        .sidebar-item { width: 48px; height: 48px; border: 0; background: transparent; color: inherit; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.2s; font-size: 20px; }
        .sidebar-item:hover { background: rgba(255,255,255,0.1); }
        .sidebar-item.active { background: var(--accent); }
        .sidebar-logo { margin-bottom: 16px; display: flex; align-items: center; justify-content: center; }
        .sidebar-logo img { width: 36px; height: 36px; border-radius: 50%; }

        /* Main content */
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        /* Top bar */
        .topbar { display: flex; align-items: center; padding: 12px 24px; gap: 16px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .topbar-title { font-size: 18px; font-weight: 600; }
        .topbar-stats { color: var(--text-dim); font-size: 13px; margin-left: auto; }
        .topbar-search { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 6px 12px; color: var(--text); font-size: 13px; width: 240px; }
        .topbar-search::placeholder { color: var(--text-muted); }

        /* Content area */
        .content { flex: 1; overflow-y: auto; padding: 24px; }

        /* Card grid */
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
        .card { background: var(--bg-card); border-radius: 8px; overflow: hidden; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; position: relative; }
        .card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
        .card-poster { width: 100%; aspect-ratio: 2/3; object-fit: cover; background: #111; display: block; }
        .card-info { padding: 10px; }
        .card-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-meta { font-size: 11px; color: var(--text-dim); margin-top: 4px; display: flex; justify-content: space-between; align-items: center; }
        .card-rating { color: var(--accent-yellow); }
        .card-actions { position: absolute; top: 8px; right: 8px; display: flex; flex-direction: column; gap: 4px; opacity: 0; transition: opacity 0.2s; }
        .card:hover .card-actions, .card:focus-within .card-actions { opacity: 1; }
        .card-btn { width: 32px; height: 32px; border-radius: 50%; border: none; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; }
        .card-btn.green { background: var(--accent-green); color: #fff; }
        .card-btn.red { background: var(--accent); color: #fff; }
        .card-btn.blue { background: var(--accent-blue); color: #fff; }

        /* Detail panel */
        .detail-panel { position: fixed; top: 0; right: -480px; width: 480px; height: 100vh; background: var(--bg-card); border-left: 1px solid rgba(255,255,255,0.05); transition: right 0.3s; z-index: 100; overflow-y: auto; }
        .detail-panel.open { right: 0; }
        .detail-backdrop { width: 100%; height: 240px; object-fit: cover; }
        .detail-poster-wrap { display: flex; margin-top: -60px; padding: 0 24px; gap: 16px; }
        .detail-poster { width: 100px; border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,0.5); }
        .detail-info { padding: 16px 24px; }
        .detail-title { font-size: 22px; font-weight: 700; }
        .detail-meta { color: var(--text-dim); font-size: 13px; margin-top: 4px; }
        .detail-overview { font-size: 14px; line-height: 1.6; color: var(--text-dim); margin-top: 16px; }
        .detail-actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
        .btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.85; }
        .btn-green { background: var(--accent-green); color: #fff; }
        .btn-red { background: var(--accent); color: #fff; }
        .btn-yellow { background: var(--accent-yellow); color: #fff; }
        .btn-blue { background: var(--accent-blue); color: #fff; }
        .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: var(--text); }
        .btn-close { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 50%; background: rgba(0,0,0,0.6); border: none; color: #fff; font-size: 16px; cursor: pointer; }

        /* Mode tabs */
        .mode-tabs { display: flex; gap: 4px; }
        .mode-tab { padding: 6px 14px; border: 0; background: transparent; font-family: inherit; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.2s; color: var(--text-dim); }
        .mode-tab:hover { background: rgba(255,255,255,0.05); }
        .mode-tab.active { background: var(--accent); color: #fff; }
        .mode-tab.active-green { background: var(--accent-green); color: #fff; }
        .mode-tab.active-yellow { background: var(--accent-yellow); color: #fff; }

        /* View toggle */
        .view-toggle { display: flex; gap: 4px; margin-left: 12px; }
        .view-btn { width: 32px; height: 32px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); background: transparent; color: var(--text-dim); cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; }
        .view-btn.active { background: var(--accent-blue); border-color: var(--accent-blue); color: #fff; }

        /* Single card view */
        .single-card-container { display: flex; align-items: center; justify-content: center; height: 100%; gap: 24px; }
        .single-card { background: var(--bg-card); border-radius: 12px; overflow: hidden; width: 400px; max-height: calc(100vh - 120px); box-shadow: 0 8px 32px rgba(0,0,0,0.5); position: relative; cursor: grab; transition: transform 0.3s, opacity 0.3s; }
        .single-card.dragging { cursor: grabbing; }
        .single-card.swipe-left { transform: translateX(-120%) rotate(-15deg); opacity: 0; }
        .single-card.swipe-right { transform: translateX(120%) rotate(15deg); opacity: 0; }
        .single-card.swipe-up { transform: translateY(-120%); opacity: 0; }
        .single-card-poster { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; }
        .single-card-gradient { position: absolute; bottom: 0; left: 0; right: 0; height: 50%; background: linear-gradient(transparent, rgba(0,0,0,0.9)); pointer-events: none; }
        .single-card-info { position: absolute; bottom: 0; left: 0; right: 0; padding: 20px; }
        .single-card-title { font-size: 24px; font-weight: 700; }
        .single-card-meta { font-size: 13px; color: var(--text-dim); margin-top: 4px; }
        .single-card-overview { font-size: 12px; color: var(--text-dim); margin-top: 8px; line-height: 1.4; max-height: 60px; overflow: hidden; }
        .single-card-badge { position: absolute; top: 20px; padding: 8px 16px; border-radius: 8px; font-size: 18px; font-weight: 700; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
        .single-card-badge.left { left: 20px; background: var(--accent); color: #fff; }
        .single-card-badge.right { right: 20px; background: var(--accent-green); color: #fff; }
        .single-card-badge.up { left: 50%; transform: translateX(-50%); top: 20px; background: var(--accent-yellow); color: #fff; }

        .action-buttons { display: flex; flex-direction: column; gap: 12px; }
        .action-btn { width: 56px; height: 56px; border-radius: 50%; border: 2px solid; cursor: pointer; font-size: 22px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; background: transparent; }
        .action-btn:hover { transform: scale(1.15); }
        .action-btn.red { border-color: var(--accent); color: var(--accent); }
        .action-btn.red:hover { background: var(--accent); color: #fff; }
        .action-btn.yellow { border-color: var(--accent-yellow); color: var(--accent-yellow); }
        .action-btn.yellow:hover { background: var(--accent-yellow); color: #fff; }
        .action-btn.green { border-color: var(--accent-green); color: var(--accent-green); }
        .action-btn.green:hover { background: var(--accent-green); color: #fff; }
        .action-btn.blue { border-color: var(--accent-blue); color: var(--accent-blue); }
        .action-btn.blue:hover { background: var(--accent-blue); color: #fff; }

        /* Sort/filter bar */
        .filter-bar { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
        .filter-chip { padding: 6px 12px; border-radius: 20px; font-size: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); cursor: pointer; transition: all 0.2s; color: var(--text-dim); }
        .filter-chip:hover { border-color: var(--accent-blue); color: var(--text); }
        .filter-chip.active { background: var(--accent-blue); border-color: var(--accent-blue); color: #fff; }

        /* Toast */
        .toast { position: fixed; bottom: 24px; right: 24px; background: var(--bg-card); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 12px 20px; font-size: 13px; z-index: 200; transform: translateY(100px); opacity: 0; transition: all 0.3s; }
        .toast.show { transform: translateY(0); opacity: 1; }

        /* History view */
        .history-list { display: flex; flex-direction: column; gap: 8px; }
        .history-item { display: flex; align-items: center; gap: 12px; background: var(--bg-card); border-radius: 8px; padding: 12px; }
        .history-poster { width: 40px; height: 60px; border-radius: 4px; object-fit: cover; background: #111; }
        .history-info { flex: 1; }
        .history-title { font-size: 14px; font-weight: 600; }
        .history-action { font-size: 12px; margin-top: 2px; }
        .history-btn { padding: 4px 10px; border-radius: 4px; border: none; cursor: pointer; font-size: 11px; font-weight: 600; }

        /* Loading */
        .loading { display: flex; align-items: center; justify-content: center; height: 200px; color: var(--text-dim); }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

        /* Settings */
        .settings-group { background: var(--bg-card); border-radius: 8px; padding: 20px; margin-bottom: 16px; }
        .settings-group h3 { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: var(--accent-green); }
        .settings-row { display: flex; gap: 12px; margin-bottom: 12px; align-items: center; }
        .settings-label { font-size: 12px; color: var(--text-dim); width: 140px; flex-shrink: 0; }
        .settings-input { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 8px 12px; color: var(--text); font-size: 13px; }
        .settings-input:focus { outline: none; border-color: var(--accent-blue); }
        .settings-select { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 8px 12px; color: var(--text); font-size: 13px; }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-logo"><img src="/static/icon_round_64.png" alt="TV Tenderr" style="width:48px;height:48px;border-radius:50%;"></div>
        <button type="button" class="sidebar-item active" data-view="movies" title="Movies" aria-label="Movies">🎬</button>
        <button type="button" class="sidebar-item" data-view="shows" title="Shows" aria-label="Shows">📺</button>
        <button type="button" class="sidebar-item" data-view="discover" title="Discover" aria-label="Discover">🔍</button>
        <button type="button" class="sidebar-item" data-view="calendar" title="Calendar" aria-label="Calendar">📅</button>
        <button type="button" class="sidebar-item" data-view="history" title="History" aria-label="History">📋</button>
        <button type="button" class="sidebar-item" data-view="settings" title="Settings" aria-label="Settings">⚙️</button>
    </div>

    <!-- Main content -->
    <div class="main">
        <div class="topbar">
            <div class="topbar-title" id="pageTitle">Movies</div>
            <div class="mode-tabs" id="discoverTabs" style="display:none">
                <button type="button" class="mode-tab active" data-type="movies">🎬 Movies</button>
                <button type="button" class="mode-tab" data-type="shows">📺 Shows</button>
            </div>
            <div class="filter-bar" id="sortBar" style="display:none">
                <button type="button" class="filter-chip active" data-sort="popularity.desc">🔥 Popular</button>
                <button type="button" class="filter-chip" data-sort="release_date.desc">🆕 Newest</button>
                <button type="button" class="filter-chip" data-sort="vote_average.desc">⭐ Top Rated</button>
            </div>
            <input type="text" class="topbar-search" placeholder="Search..." aria-label="Search" id="searchInput">
            <div class="view-toggle">
                <button class="view-btn active" data-viewmode="card" title="Card view">🃏</button>
                <button class="view-btn" data-viewmode="grid" title="Grid view">⊞</button>
            </div>
            <div class="topbar-stats" id="statsText"></div>
        </div>
        <div class="content" id="contentArea">
            <div class="loading">Loading...</div>
        </div>
    </div>

    <!-- Detail panel -->
    <div class="detail-panel" id="detailPanel">
        <button class="btn-close" onclick="closeDetail()">✕</button>
        <img class="detail-backdrop" id="detailBackdrop" src="" alt="">
        <div class="detail-poster-wrap">
            <img class="detail-poster" id="detailPoster" src="" alt="">
        </div>
        <div class="detail-info">
            <div class="detail-title" id="detailTitle"></div>
            <div class="detail-meta" id="detailMeta"></div>
            <div class="detail-overview" id="detailOverview"></div>
            <div class="detail-actions" id="detailActions"></div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        const API = '';
        let currentView = 'movies';
        let discoverType = 'movies';
        let discoverSort = 'popularity.desc';
        let currentPage = 1;
        let viewMode = 'card'; // 'card' or 'grid'
        let currentItems = [];
        let currentCardIndex = 0;

        // Sidebar navigation
        document.querySelectorAll('.sidebar-item').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                currentView = item.dataset.view;
                document.getElementById('pageTitle').textContent = {
                    movies: 'Movies', shows: 'TV Shows', discover: 'Discover', history: 'History', settings: 'Settings'
                }[currentView];
                document.getElementById('discoverTabs').style.display = currentView === 'discover' ? 'flex' : 'none';
                document.getElementById('sortBar').style.display = currentView === 'discover' ? 'flex' : 'none';
                currentPage = 1;
                loadView();
            });
        });

        // Discover type tabs
        document.querySelectorAll('#discoverTabs .mode-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('#discoverTabs .mode-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                discoverType = tab.dataset.type;
                currentPage = 1;
                loadView();
            });
        });

        // Sort chips
        document.querySelectorAll('#sortBar .filter-chip').forEach(chip => {
            chip.addEventListener('click', () => {
                document.querySelectorAll('#sortBar .filter-chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                discoverSort = chip.dataset.sort;
                currentPage = 1;
                loadView();
            });
        });

        // View toggle
        document.querySelectorAll('.view-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                viewMode = btn.dataset.viewmode;
                loadView();
            });
        });

        // Search
        document.getElementById('searchInput').addEventListener('input', debounce(() => {
            currentPage = 1;
            loadView();
        }, 300));

        function debounce(fn, ms) {
            let timer;
            return (...args) => { clearTimeout(timer); timer = setTimeout(() => fn(...args), ms); };
        }

        const DESTRUCTIVE_UNDO_MS = 10000;
        let pendingDestructive = null;
        let undoTimer = null;

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function safeUrl(value) {
            const text = String(value || '');
            if (text.startsWith('https://') || text.startsWith('http://') || text.startsWith('/')) return escapeHtml(text);
            return '';
        }

        function element(tag, className, text) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text !== undefined) node.textContent = String(text ?? '');
            return node;
        }

        function imageUrl(value) {
            try {
                const url = new URL(String(value || ''), location.href);
                return ['http:', 'https:'].includes(url.protocol) ? url.href : '';
            } catch (_) { return ''; }
        }

        function poster(value, title, className) {
            const img = element('img', className);
            img.alt = String(title || '');
            img.src = imageUrl(value);
            img.addEventListener('error', () => { img.style.visibility = 'hidden'; }, {once: true});
            return img;
        }

        function button(label, className, callback) {
            const node = element('button', className, label);
            node.type = 'button';
            node.setAttribute('aria-label', label);
            node.addEventListener('click', event => { event.stopPropagation(); callback(); });
            return node;
        }

        function renderGrid(content, items, type) {
            const mediaType = type === 'discover' ? discoverType : type;
            const grid = element('div', 'card-grid');
            items.forEach(item => {
                const discover = type === 'discover';
                const card = element('div', 'card');
                const open = () => discover ? showDiscoverDetail(item, mediaType) : showDetail(item, type);
                card.tabIndex = 0;
                card.setAttribute('role', 'button');
                card.setAttribute('aria-label', 'Details: ' + item.title);
                card.addEventListener('click', open);
                card.addEventListener('keydown', event => {
                    if (event.target === card && ['Enter', ' '].includes(event.key)) { event.preventDefault(); open(); }
                });
                card.append(poster(item.posterUrl, item.title, 'card-poster'));
                const actions = element('div', 'card-actions');
                actions.append(button(discover ? 'Add' : 'Keep', 'card-btn green', () => discover ? discoverAdd(item.tmdbId, mediaType) : actionKeep(item.id, type)));
                actions.append(button(discover ? 'Dislike' : 'Block', 'card-btn red', () => discover ? scheduleDiscoverDislike(item, mediaType) : scheduleLibraryBlock(item.id, type, item.title)));
                const info = element('div', 'card-info');
                info.append(element('div', 'card-title', item.title), element('div', 'card-meta', [item.year, item.sizeGB ? item.sizeGB + ' GB' : '', item.status, item.rating].filter(Boolean).join(' · ')));
                if (item.cast?.length) info.append(element('div', '', item.cast.join(', ')));
                if (item.watched) info.append(element('div', '', 'Watched'));
                appendLinks(info, item, discover);
                card.append(actions, info);
                grid.append(card);
            });
            content.replaceChildren(grid);
        }

        function appendLinks(parent, item, discover) {
            const links = [
                [item.trailerId, 'Trailer', 'https://www.youtube.com/watch?v='],
                [item.imdbId, 'IMDb', 'https://www.imdb.com/title/'],
                [discover && item.tmdbId, 'TMDb', 'https://www.themoviedb.org/' + (discoverType === 'movies' ? 'movie/' : 'tv/')]
            ];
            links.forEach(([id, label, prefix]) => {
                if (!id) return;
                const link = element('a', '', label);
                link.href = prefix + encodeURIComponent(id);
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                link.addEventListener('click', event => event.stopPropagation());
                parent.append(link);
            });
        }

        function authHeaders(extra) {
            const headers = Object.assign({}, extra || {});
            const token = sessionStorage.getItem('tvTenderrToken') || '';
            if (token) headers['Authorization'] = 'Bearer ' + token;
            return headers;
        }

        function apiFetch(url, options) {
            const opts = Object.assign({}, options || {});
            opts.headers = authHeaders(opts.headers);
            return fetch(url, opts);
        }

        function clearPendingDestructive() {
            if (undoTimer) clearTimeout(undoTimer);
            undoTimer = null;
            pendingDestructive = null;
            const banner = document.getElementById('undoBanner');
            if (banner) banner.remove();
        }

        // Library IDs and TMDb IDs are separate namespaces; movie/show IDs can collide.
        function actionIdentity(namespace, type, id) {
            return JSON.stringify([namespace, type, String(id)]);
        }

        function cancelConflictingDestructive(identity) {
            if (pendingDestructive?.identity === identity) clearPendingDestructive();
        }

        function scheduleLibraryBlock(id, type, title) {
            scheduleDestructive('Delete: ' + title, actionIdentity('library', type, id), () => actionBlock(id, type));
        }

        function scheduleDiscoverDislike(item, type) {
            const {tmdbId, title, year, posterUrl} = item;
            scheduleDestructive('Exclude: ' + title, actionIdentity('discover', type, tmdbId), () => discoverHide(tmdbId, title, year, posterUrl, type));
        }

        function scheduleDestructive(message, identity, action) {
            clearPendingDestructive();
            pendingDestructive = Object.freeze({identity, action});
            const banner = document.createElement('div');
            banner.id = 'undoBanner';
            banner.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1E1E2E;color:#fff;padding:12px 16px;border-radius:8px;z-index:2000;display:flex;gap:12px;align-items:center;';
            const label = document.createElement('span');
            label.textContent = message;
            const undo = document.createElement('button');
            undo.type = 'button';
            undo.textContent = 'Undo';
            undo.onclick = () => clearPendingDestructive();
            banner.appendChild(label);
            banner.appendChild(undo);
            document.body.appendChild(banner);
            undoTimer = setTimeout(() => {
                const pending = pendingDestructive;
                pendingDestructive = null;
                undoTimer = null;
                if (banner.parentNode) banner.remove();
                if (pending) pending.action();
            }, DESTRUCTIVE_UNDO_MS);
        }

        async function postChecked(url, options) {
            const response = await apiFetch(url, options);
            if (!response.ok) throw new Error(`Request failed: ${response.status}`);

        function renderSingleCard(content, type) {
            if (currentItems.length === 0) {
                content.innerHTML = '<div class="loading">No items to show</div>';
                return;
            }
            if (currentCardIndex >= currentItems.length) {
                content.innerHTML = '<div class="loading">No more items! Click to load more.</div>';
                content.style.cursor = 'pointer';
                content.onclick = () => { currentPage++; loadView(); };
                return;
            }

            content.onclick = null;
            content.style.cursor = '';
            const item = currentItems[currentCardIndex];
            const isDiscover = type === 'discover';

            const actions = element('div', 'action-buttons');
            actions.append(
                button(isDiscover ? 'Dislike' : 'Block', 'action-btn red', isDiscover ? singleDiscoverHide : singleBlock),
                button('Skip', 'action-btn yellow', singleSkip),

            );
            if (!isDiscover) actions.append(button('Super Keep', 'action-btn blue', singleSuperKeep));
            const card = element('div', 'single-card');
            card.id = 'activeCard';
            [['left', 'badgeLeft', 'HIDE'], ['right', 'badgeRight', isDiscover ? 'ADD' : 'KEEP'], ['up', 'badgeUp', 'SKIP']].forEach(([direction, id, text]) => {
                const badge = element('div', 'single-card-badge ' + direction, text);
                badge.id = id;
                card.append(badge);
            });
            card.append(poster(item.posterUrl, item.title, 'single-card-poster'), element('div', 'single-card-gradient'));
            const info = element('div', 'single-card-info');

            if (item.cast?.length) info.append(element('div', 'single-card-cast', item.cast.join(', ')));
            if (item.watched) info.append(element('div', 'single-card-watched', 'Watched'));
            appendLinks(info, item, isDiscover);
            info.append(element('div', 'single-card-overview', item.overview));
            card.append(info);
            container.append(actions, card);
            content.replaceChildren(container);

            // Drag to swipe
            setupCardDrag();
        }

        function setupCardDrag() {
            const card = document.getElementById('activeCard');
            if (!card) return;
            let startX = 0, startY = 0, currentX = 0, currentY = 0, dragging = false;

            card.addEventListener('mousedown', (e) => {
                startX = e.clientX; startY = e.clientY; dragging = true;
                card.classList.add('dragging');
            });

            document.addEventListener('mousemove', (e) => {
                if (!dragging) return;
                currentX = e.clientX - startX;
                currentY = e.clientY - startY;
                card.style.transform = `translateX(${currentX}px) translateY(${currentY}px) rotate(${currentX / 20}deg)`;

                const badgeL = document.getElementById('badgeLeft');
                const badgeR = document.getElementById('badgeRight');
                const badgeU = document.getElementById('badgeUp');
                if (badgeL) badgeL.style.opacity = currentX < -50 ? Math.min(Math.abs(currentX) / 200, 1) : 0;
                if (badgeR) badgeR.style.opacity = currentX > 50 ? Math.min(currentX / 200, 1) : 0;
                if (badgeU) badgeU.style.opacity = currentY < -50 ? Math.min(Math.abs(currentY) / 200, 1) : 0;
            });

            document.addEventListener('mouseup', () => {
                if (!dragging) return;
                dragging = false;
                card.classList.remove('dragging');

                if (Math.abs(currentX) > 150 || Math.abs(currentY) > 150) {
                    if (currentX > 150) { card.classList.add('swipe-right'); setTimeout(() => singleAction('right'), 300); }
                    else if (currentX < -150) { card.classList.add('swipe-left'); setTimeout(() => singleAction('left'), 300); }
                    else if (currentY < -150) { card.classList.add('swipe-up'); setTimeout(() => singleAction('up'), 300); }
                    else if (currentY > 150) { card.classList.add('swipe-down'); setTimeout(() => singleAction('down'), 300); }
                    else { resetCard(card); }
                } else {
                    resetCard(card);
                }
                currentX = 0; currentY = 0;
            });
        }

        function resetCard(card) {
            if (!card) return;
            card.classList.remove('swipe-right', 'swipe-left', 'swipe-up', 'swipe-down');
            card.style.transform = '';
            const badges = card.querySelectorAll('.single-card-badge');
            badges.forEach(b => b.style.opacity = 0);
        }

        function singleAction(direction) {
            const isDiscover = currentView === 'discover';
            if (direction === 'right') {
                if (isDiscover) singleDiscoverAdd(); else singleKeep();
            } else if (direction === 'left') {
                if (isDiscover) singleDiscoverHide(); else singleBlock();
            } else if (direction === 'up') {
                singleSkip();
            } else if (direction === 'down') {
                singleSuperKeep();
            }
        }

        async function singleKeep() {
            const item = currentItems[currentCardIndex];
            if (item) await actionKeep(item.id, currentView);
        }

        async function singleSuperKeep() {
            const item = currentItems[currentCardIndex];
            if (item && currentView !== 'discover') await actionSuperKeep(item.id, currentView);
        }

        function singleBlock() {
            const item = currentItems[currentCardIndex];
            if (!item) return;
            resetCard(document.getElementById('activeCard'));
            const type = currentView;
            scheduleLibraryBlock(item.id, type, item.title);
        }

        async function singleSkip() {

        async function loadView() {
            const content = document.getElementById('contentArea');
            const search = document.getElementById('searchInput').value.trim();
            content.innerHTML = '<div class="loading">Loading...</div>';

            try {
                switch (currentView) {
                    case 'movies': await loadLibrary('movies', content, search); break;
                    case 'shows': await loadLibrary('shows', content, search); break;
                    case 'discover': await loadDiscover(content); break;
                    case 'calendar': await loadCalendar(content); break;
                    case 'history': await loadHistory(content); break;
                    case 'settings': await loadSettings(content); break;
                }
            } catch (e) {
                content.replaceChildren(element('div', 'loading', 'Error: ' + e.message));

        async function loadLibrary(type, content, search) {
            const endpoint = type === 'movies' ? '/api/movies' : '/api/shows';
            const params = new URLSearchParams();
            if (search) params.set('search', search);
            if (currentFilters.genre) params.set('genre', currentFilters.genre);
            if (currentFilters.minYear) params.set('min_year', currentFilters.minYear);
            if (currentFilters.maxYear) params.set('max_year', currentFilters.maxYear);
            if (currentFilters.minRating) params.set('min_rating', currentFilters.minRating);
            const query = params.toString();
            const res = await apiFetch(API + endpoint + (query ? '?' + query : ''));
            if (!res.ok) throw new Error(`Library request failed: ${res.status}`);
            const data = await res.json();
            const items = type === 'movies' ? data.movies : data.shows;
            const filtered = search ? items.filter(i => (i.title || '').toLowerCase().includes(search.toLowerCase())) : items;

            currentItems = filtered;
            document.getElementById('statsText').textContent = `${filtered.length} ${type}`;

            if (viewMode === 'card') {
                currentCardIndex = 0;
                renderSingleCard(content, type);
            } else {
                renderGrid(content, filtered, type);
            }
        }

        async function loadDiscover(content) {
            const endpoint = discoverType === 'movies' ? '/api/discover/movies' : '/api/discover/shows';
            const res = await apiFetch(`${API}${endpoint}?page=${currentPage}&limit=20&sort_by=${discoverSort}`);
            const data = await res.json();
            const items = data.movies || data.shows || [];

            currentItems = items;
            document.getElementById('statsText').textContent = `Page ${currentPage} · ${items.length} items`;

            if (viewMode === 'card') {
                currentCardIndex = 0;
                renderSingleCard(content, 'discover');
            } else {
                renderGrid(content, items, 'discover');
            }
        }

            const [moviesHist, showsHist, discoverHist] = await Promise.all([

            ]);

            const all = [
                ...moviesHist.history.map(h => ({...h, source: 'Movies'})),

            ].sort((a, b) => (b.timestamp || '').localeCompare(a.timestamp || ''));

            const actionColors = { keep: '#2ecc71', super_keep: '#f1c40f', block: '#e74c3c', clean: '#3498db', added: '#2ecc71', hidden: '#e74c3c' };
            const actionLabels = { keep: '✓ KEPT', super_keep: '⭐ SUPER', block: '✗ BLOCKED', clean: '🧹 CLEANED', added: '⬇️ ADDED', hidden: '✗ HIDDEN' };

                info.append(element('div', 'history-title', item.title || ('Unknown #' + item.movieId)));
                const action = element('div', 'history-action', [actionLabels[item.action] || item.action, item.source, item.year].filter(Boolean).join(' · '));
                action.style.color = actionColors[item.action] || '#888';

                const actions = {
                    keep: ['Un-keep', () => unkeep(item.movieId, item.source)],
                    super_keep: ['Un-keep', () => unkeep(item.movieId, item.source)],
                    block: ['Restore', () => unblock(item.movieId, item.source)],
                    clean: ['Re-monitor', () => unclean(item.movieId)],
                    added: ['Remove', () => scheduleDestructive('Remove: ' + item.title, actionIdentity('discover', item.type, item.tmdbId), () => removeDiscover(item.tmdbId, item.type))],
                    hidden: ['Show Again', () => unhideDiscover(item.tmdbId)]

                if (actions[item.action]) row.append(button(actions[item.action][0], 'history-btn', actions[item.action][1]));
                list.append(row);
            });
            content.replaceChildren(list);
        }

        }

        async function discoverAdd(tmdbId, type) {
            cancelConflictingDestructive(actionIdentity('discover', type, tmdbId));
            await performAction(`/api/discover/${encodeURIComponent(tmdbId)}/${type === 'movies' ? 'add_movie' : 'add_show'}`, 'Added to library');
        }

        async function discoverHide(tmdbId, title, year, posterUrl, type) {
            await performAction(`/api/discover/${encodeURIComponent(tmdbId)}/dislike`, 'Added to Import List Exclusions', {
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({title, year, posterUrl, type})
            });
        }

        async function postHistoryAction(endpoint) {
            const response = await apiFetch(API + endpoint, { method: 'POST' });
            if (!response.ok) throw new Error(`History action failed: ${response.status}`);
        }

        async function finishHistoryAction(endpoint, successMessage) {
            try {
                await postHistoryAction(endpoint);
                showToast(successMessage);
                loadView();
            } catch (error) {
                showToast(error.message);
            }
        }

        async function unkeep(id, source) {
            const endpoint = source === 'Movies' ? `/api/movies/${id}/unkeep` : `/api/shows/${id}/unkeep`;
            await finishHistoryAction(endpoint, 'Un-kept');
        }

        async function unblock(id, source) {
            const endpoint = source === 'Movies' ? `/api/movies/${id}/unblock` : `/api/shows/${id}/unblock`;
            await finishHistoryAction(endpoint, 'Restored');
        }

        async function unclean(id) {
            await finishHistoryAction(`/api/shows/${id}/unclean`, 'Episodes re-monitored');
        }

        async function removeDiscover(tmdbId, type) {
            const endpoint = type === 'show' ? 'remove_show' : 'remove_movie';
            await finishHistoryAction(`/api/discover/${tmdbId}/${endpoint}`, 'Removed from library');
        }

        async function unhideDiscover(tmdbId) {
            await finishHistoryAction(`/api/discover/${tmdbId}/unhide`, 'Back in Discover; exclusion removed when applicable');
        }

        async function checkForUpdates() {
            const statusEl = document.getElementById('updateStatus');
            if (statusEl) statusEl.textContent = 'Checking...';
            try {
                const res = await apiFetch(API + '/api/latest-release');
                const data = await res.json();
                if (data.error) {
                    if (statusEl) statusEl.textContent = 'Check failed: ' + data.error;
                    if (statusEl) statusEl.style.color = '#e74c3c';
                } else {
                    if (statusEl) {
                        statusEl.replaceChildren(element('strong', '', 'Update: ' + (data.tagName || data.version)));
                        const link = element('a', '', 'View on GitHub');
                        const url = imageUrl(data.htmlUrl);
                        if (url && new URL(url).hostname === 'github.com') {
                            link.href = url; link.target = '_blank'; link.rel = 'noopener noreferrer';
                            statusEl.append(link);
                        }
                        statusEl.style.color = '#2ecc71';
                    }
                }
            } catch (e) {
                if (statusEl) statusEl.textContent = 'Check failed';
                if (statusEl) statusEl.style.color = '#e74c3c';
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // Init runs after all lexical state (filters/calendar) is initialized.
        window.addEventListener('DOMContentLoaded', () => loadView());

            const stats = await res.json();

                `  Super Kept: ${stats.movies.superKept}\n` +

                `📺 SHOWS\n` +

                `  Kept: ${stats.shows.kept}\n` +
                `  Super Kept: ${stats.shows.superKept}\n` +

        let currentFilters = {};
        function showFilter() {
            var genres = ["Any","Action","Adventure","Animation","Comedy","Crime","Documentary","Drama","Family","Fantasy","History","Horror","Music","Mystery","Romance","Sci-Fi","Thriller","War","Western"];
            var ratings = [0, 5, 6, 7, 8, 9];
            
            var h = '<div id="filterOverlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:1000;display:flex;align-items:center;justify-content:center">';
            h += '<div style="background:#1E1E2E;border-radius:12px;padding:20px;width:90%;max-width:500px">';
            h += '<h3 style="color:#fff;margin:0 0 16px">Filters</h3>';
            
            h += '<div style="color:#aaa;font-size:12px;margin-bottom:6px">Genre</div>';
            h += '<div id="genreChips" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px">';
            genres.forEach(function(g) {
                var sel = (window._filterGenre || '') === g;
                h += '<button type="button" data-genre="' + g + '" class="filter-chip' + (sel ? ' active' : '') + '">' + g + '</button>';
            });
            h += '</div>';
            
            h += '<div style="color:#aaa;font-size:12px;margin-bottom:6px">Year Range</div>';
            h += '<div style="display:flex;gap:8px;margin-bottom:16px">';
            h += '<input id="fMinYear" type="number" placeholder="Min year" style="flex:1;background:#2A2A3E;border:1px solid #3A3A4E;color:#fff;padding:8px 12px;border-radius:8px">';
            h += '<span style="color:#555;line-height:36px">to</span>';
            h += '<input id="fMaxYear" type="number" placeholder="Max year" style="flex:1;background:#2A2A3E;border:1px solid #3A3A4E;color:#fff;padding:8px 12px;border-radius:8px">';
            h += '</div>';
            
            h += '<div style="color:#aaa;font-size:12px;margin-bottom:6px">Minimum Rating</div>';
            h += '<div id="ratingChips" style="display:flex;gap:6px;margin-bottom:20px">';
            ratings.forEach(function(r) {
                var sel = (window._filterMinRating || 0) === r;
                h += '<button type="button" data-rating="' + r + '" class="filter-chip' + (sel ? ' active' : '') + '">' + (r === 0 ? 'Any' : r + '+') + '</button>';
            });
            h += '</div>';
            
            h += '<div style="display:flex;justify-content:flex-end;gap:8px">';
            h += '<button id="clearFilters" type="button" style="background:none;border:none;color:#aaa;padding:8px 16px;cursor:pointer">Clear All</button>';
            h += '<button id="applyFilters" type="button" style="background:#FF6B35;border:none;color:#fff;padding:8px 24px;border-radius:8px;font-weight:bold;cursor:pointer">Apply</button>';
            h += '</div></div></div>';
            
            document.body.insertAdjacentHTML('beforeend', h);
            const overlay = document.getElementById('filterOverlay');
            overlay.querySelector('#fMinYear').value = window._filterMinYear || '';
            overlay.querySelector('#fMaxYear').value = window._filterMaxYear || '';
            overlay.querySelectorAll('[data-genre]').forEach(chip => chip.addEventListener('click', () => window._pickGenre(chip)));
            overlay.querySelectorAll('[data-rating]').forEach(chip => chip.addEventListener('click', () => window._pickRating(chip)));
            overlay.querySelector('#clearFilters').addEventListener('click', window._clearFilters);
            overlay.querySelector('#applyFilters').addEventListener('click', window._applyFilters);
        }
        
        window._filterGenre = '';
        window._filterMinYear = '';
        window._filterMaxYear = '';
        window._filterMinRating = 0;
        
        window._pickGenre = function(el) {
            window._filterGenre = el.classList.contains('active') ? '' : el.dataset.genre;
            document.querySelectorAll('#genreChips .filter-chip').forEach(function(c) { c.classList.remove('active'); });
            if (window._filterGenre) el.classList.add('active');
        };
        
        window._pickRating = function(el) {
            window._filterMinRating = parseInt(el.dataset.rating);
            document.querySelectorAll('#ratingChips .filter-chip').forEach(function(c) { c.classList.remove('active'); });
            el.classList.add('active');
        };
        
        window._clearFilters = function() {
            window._filterGenre = '';
            window._filterMinYear = '';
            window._filterMaxYear = '';
            window._filterMinRating = 0;
            currentFilters = {};
            document.getElementById('filterOverlay').remove();
            loadView();
        };
        
        window._applyFilters = function() {
            window._filterMinYear = document.getElementById('fMinYear').value;
            window._filterMaxYear = document.getElementById('fMaxYear').value;
            currentFilters = {};
            if (window._filterGenre && window._filterGenre !== 'Any') currentFilters.genre = window._filterGenre;
            if (window._filterMinYear) currentFilters.minYear = window._filterMinYear;
            if (window._filterMaxYear) currentFilters.maxYear = window._filterMaxYear;
            if (window._filterMinRating) currentFilters.minRating = window._filterMinRating;
            document.getElementById('filterOverlay').remove();
            loadView();
        };
        
                
                
                
                // Update loadMovies to use filters
        const origLoadMovies = window.loadMovies;
        

        let calendarDays = 30;
        async function loadCalendar(content) {
            const res = await apiFetch(API + '/api/calendar?days=' + calendarDays);
            const data = await res.json();
            const items = data.calendar || [];
            const daysOpts = [{d:7,l:'7 days'},{d:14,l:'2 weeks'},{d:30,l:'1 month'},{d:60,l:'2 months'},{d:90,l:'3 months'}];
            content.replaceChildren();
            const controls = element('div');
            daysOpts.forEach(o => controls.append(button(o.l, 'filter-chip', () => {calendarDays = o.d; loadView();})));
            content.append(controls, element('div', '', items.length + ' upcoming releases'));
            const grid = element('div', 'card-grid');
            items.forEach(i => {
                const card = element('div', 'card');
                card.append(poster(i.posterUrl, i.title, 'card-poster'));
                const info = element('div', 'card-info');
                const status = i.hasFile ? 'Downloaded' : i.monitored ? 'Monitoring' : 'Not monitored';
                info.append(element('div', 'card-title', i.title || 'Unknown'), element('div', 'card-meta', [i.year, i.episode, i.episodeTitle, status].filter(Boolean).join(' · ')), element('div', '', i.releaseDate));
                card.append(info);
                grid.append(card);
            });
            content.append(grid);
        }
