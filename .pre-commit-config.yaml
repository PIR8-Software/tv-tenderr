# Pre-commit hooks for tv-tenderr.
#
# The codebase is format-clean (black + isort) and holds the lint baseline
# (ruff selection in pyproject.toml), so the formatter/linter hooks are
# enforced here and in CI. Hooks self-fix on touched files; stricter lint
# rule families are deferred to a lint-hardening pass (see pyproject.toml).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff
        args: [--fix]
  - repo: https://github.com/pycqa/isort
    rev: 9.0.2
    hooks:
      - id: isort
  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black
