# Tool configuration for tv-tenderr.
#
# The lint gate is the classic pycodestyle-pyflakes set (E4/E7/E9/F) plus
# bugbear (B) — the rule family covering the mutable-argument-default and
# loop-variable-closure bugs hardened in the lint-hardening pass, now gated
# against regression. The remaining default families (S, SIM, BLE, C4, PERF,
# PL, UP, FURB) still carry findings needing per-site judgment and are
# deferred to a later sweep rather than mixed into hardening fixes.

[tool.isort]
profile = "black"
skip_gitignore = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
