name: Release source checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Publishing is intentionally manual: upload only the reviewed, certificate- and
# checksum-verified production APK. CI must not replace a deployed release asset.
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python tests/run_isolated.py
      - run: bash -n setup.sh install.sh release.sh
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Release unit tests (no signing or APK publication)
        working-directory: android
        run: >-
          ./gradlew :app:testReleaseUnitTest --no-daemon --max-workers=1
          -Dorg.gradle.jvmargs='-Xmx1536m -XX:MaxMetaspaceSize=512m'
          -Pkotlin.compiler.execution.strategy=in-process
          -PTV_TENDERR_KEYSTORE_PASSWORD=ci-not-a-signing-secret
          -PTV_TENDERR_KEY_PASSWORD=ci-not-a-signing-secret
