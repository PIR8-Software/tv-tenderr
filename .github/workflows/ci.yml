name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          for file in requirements.txt requirements-dev.txt; do
            if [ -f "$file" ]; then
              python -m pip install -r "$file"
            fi
          done
      - run: python -m pytest -q
      - run: bash -n setup.sh install.sh release.sh bump_version.sh
      - name: Lint (ruff, black, isort)
        run: |
          ruff check .
          black --check .
          isort --check-only .
